apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kidwatch.fullname" . }}-data
  labels:
    {{- include "kidwatch.labels" . | nindent 4 }}
  annotations:
    # Baza trzyma otwarte sesje, klucze wyslanych powiadomien i kursor strumienia.
    # Skasowanie jej gubi sesje i powoduje ponowne wyslanie pushy, wiec wolumen
    # ma przezyc `helm uninstall`.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    # SQLite ma jednego pisarza — ReadWriteOnce to czesc tego samego warunku,
    # co replicas:1 i strategia Recreate.
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
