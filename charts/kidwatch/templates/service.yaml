{{- if .Values.panel.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kidwatch.fullname" . }}
  labels:
    {{- include "kidwatch.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kidwatch.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
