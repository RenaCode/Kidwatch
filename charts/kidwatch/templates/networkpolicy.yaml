{{- if .Values.networkPolicy.enabled -}}
{{/* Uzasadnienie i mapa przeplywow: `networkPolicy` w values.yaml. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kidwatch.fullname" . }}
  labels:
    {{- include "kidwatch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kidwatch.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.panel.enabled }}
  ingress:
    # Panel WWW, wylacznie przez Ingress kidwatch.renacode.com. Port poda,
    # nie Service'u (80) - polityka dziala po DNAT.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefik.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.traefik.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.panel.port }}
  {{- end }}
{{- if .Values.networkPolicy.egress.enabled }}
---
# EGRESS: bez sieci domowej (`kidwatch.regulyEgress`) PLUS dokladnie te cele
# w domu, ktorych kidwatch uzywa (`networkPolicy.egress.wDomu`). Polityki sie
# SUMUJA: adres z `except` przechodzi, jesli pasuje do reguly nizej.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kidwatch.fullname" . }}-egress
  labels:
    {{- include "kidwatch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kidwatch.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- include "kidwatch.regulyEgress" . | nindent 4 }}
    {{- range .Values.networkPolicy.egress.wDomu }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
{{- end }}
{{- end }}
