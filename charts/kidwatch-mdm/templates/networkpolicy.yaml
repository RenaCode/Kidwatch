{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kidwatch-mdm.fullname" . }}
  labels:
    {{- include "kidwatch-mdm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kidwatch-mdm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # iPady przez Traefika.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefik.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.traefik.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.mdm }}
    # API sterujace: tylko Kidwatch z tej samej przestrzeni nazw.
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.adminClients.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.admin }}
{{- end }}
