# kidwatch — przyklad konfiguracji. Skopiuj do config.yaml i dostosuj.
# SEKRETY NIE NALEZA DO TEGO PLIKU. Sa czytane ze zmiennych srodowiskowych:
#   NEXTDNS_API_KEY, ADGUARD_PASSWORD, NTFY_TOKEN, HA_WEBHOOK_ID, HA_TOKEN

timezone: Europe/Warsaw

# ---------------------------------------------------------------- zrodlo DNS
source:
  kind: nextdns            # nextdns | adguard

  nextdns:
    profile_id: "abc123"   # ID profilu z my.nextdns.io (NIE klucz API)
    # raw=false (domyslnie) zwraca tylko zapytania "nawigacyjne" — mniej szumu.
    # raw=true zwraca wszystkie typy zapytan; przydatne do debugowania mapowania domen.
    raw: false
    # Filtrowanie po stronie API po device.id. Puste = bierz wszystko i filtruj lokalnie
    # wedlug sekcji `devices` (zalecane przy wielu urzadzeniach).
    server_side_device_filter: false
    # Przy kilku profilach (devices[].nextdns_profile) kazdy ma wlasny strumien.
    # Minimalny odstep miedzy ich otwarciami — razem wpadaja w 429.
    connect_spacing_seconds: 5

  adguard:
    base_url: "http://192.168.1.10:3000"
    username: "admin"
    poll_interval_seconds: 15
    page_limit: 500
    # Po restarcie nie wysylaj pushy dla zdarzen starszych niz tyle minut.
    max_backfill_minutes: 5

# ------------------------------------------------------------------ urzadzenia
# display_name  -> jak ma sie pokazac w powiadomieniu
# child         -> imie dziecka (uzywane w krotkich pushach o aplikacji)
# source_ids    -> identyfikatory w zrodle. NextDNS: device.id ORAZ/LUB device.name.
#                  AdGuard: client_id ORAZ/LUB client (IP).
#                  Dopasowanie jest po dokladnej wartosci, wielkosc liter nieistotna.
#
# POLA ODCZYTU WPROST Z iPADA (opcjonalne). Bez nich dziala sama warstwa DNS.
#   udid        identyfikator urzadzenia: pymobiledevice3 bonjour mobdev2
#   host        ADRES IPv4 iPada w domowym LAN (rezerwacja DHCP). NIE IPv6 —
#               patrz komentarz w sekcji device_read nizej
#   known_apps  awaryjna lista {bundle_id: nazwa}, zrzut z:
#                 pymobiledevice3 apps list --udid <UDID>
#               Uzywana TYLKO gdy zywy odczyt inwentarza nie dziala. Bez niej
#               uruchomienia przychodzilyby BEZ NAZW aplikacji.
devices:
  - display_name: "iPad Dziecka 1"
    child: "Dziecko 1"
    source_ids: ["iPad-Dziecka-1", "8TD1G"]
    # udid: "00008101-XXXXXXXXXXXXXXXX"
    # host: "192.168.0.81"
    # known_apps:
    #   com.mojang.minecraftpe: "Minecraft"
    #   com.gameloft.asphalt9: "Asphalt"
    # unifi_mac: "02:00:00:00:00:01"   # MAC w domowym Wi-Fi (prywatny adres iOS)
    # unifi_ip: "192.168.0.81"         # albo/i stale IP z rezerwacji DHCP
    # Wlasny profil NextDNS dziecka (pod "czas gry"). Puste = source.nextdns.profile_id.
    # nextdns_profile: "def456"
  - display_name: "iPad Dziecka 2"
    child: "Dziecko 2"
    source_ids: ["iPad-Dziecka-2"]

# ----------------------------------------------------------- telewizor (opcja)
# Google TV po ADB/TCP. Klucz `adbkey` (+ .pub) w adb_key_dir, zaakceptowany
# raz na ekranie TV. Sprawdzenie: python -m kidwatch tv
tv:
  enabled: false
  name: "TV salon"
  host: "192.168.0.10"
  port: 5555
  poll_seconds: 30
  idle_minutes: 10
  adb_key_dir: ~/.android
  # Dokladny czas aplikacji z `dumpsys usagestats` (Android sam go liczy),
  # odczyt co tyle minut; w panelu i raporcie obok szacunku z sesji. 0 = wyl.
  usage_poll_minutes: 15
  # Zapas z ruchu sieci, gdy ADB nie odpowiada (sources/tv_siec.py): bajty
  # telewizora z UniFi (po `host` albo `unifi_mac`), serwis z NextDNS
  # (`nextdns_ids`). Wlaczony sam przy dzialajacej czujce UniFi.
  traffic: true
  traffic_min_mb: 10            # ogladanie = tyle MB w oknie
  traffic_window_minutes: 3
  # unifi_mac: "aa:bb:cc:dd:ee:ff"
  # nextdns_ids: ["TV-salon"]    # bez tego sesja z ruchu nazywa sie "Streaming"
  adb_alert_minutes: 30         # push "ADB nie odpowiada", gdy ruch pokazuje ogladanie
  # Sony BRAVIA REST pod `host` (sources/sony.py): zasilanie bez klucza; antena
  # (kanal, program z EPG) i HDMI z kluczem PSK w TV_SONY_PSK (kidwatch-secrets).
  # Na TV: Siec -> Siec domowa -> Sterowanie IP -> "Normalne i klucz wstepny".
  sony: true
  # Pilot Google TV (Android TV Remote v2, porty 6466/6467; sources/tv_pilot.py):
  # zasilanie i aplikacja bez ADB i bez opcji programisty. Parowanie raz,
  # w panelu na karcie TV ("Sparuj pilota TV" + kod z ekranu). Certyfikat
  # w pilot_dir (puste = tv-pilot obok bazy, na wolumenie).
  pilot: true

# -------------------------------------------------------- UniFi (opcja)
# Klucz API w zmiennej UNIFI_API_KEY. Odcisk certyfikatu UDM:
#   openssl s_client -connect 192.168.0.1:443 </dev/null 2>/dev/null \
#     | openssl x509 -noout -fingerprint -sha256
unifi:
  enabled: false
  url: "https://192.168.0.1"
  cert_sha256: ""
  window_minutes: 15
  alarm_mb: 20

# --------------------------------------------------------------------- progi
engine:
  idle_minutes: 10                  # cisza tak dluga = koniec sesji
  app_cooldown_minutes: 15          # przegladanie zbiorczo co tyle; nazwana apka raz na sesje
  session_start_merge_seconds: 20   # nieuzywane (zastapione potwierdzaniem), zostaje dla zgodnosci
  # Potwierdzanie sesji: push startu dopiero, gdy w oknie confirm_minutes sa
  # confirm_moments odrebne chwile aktywnosci (zapytania w odstepie > 10 s)
  # rozpiete na >= 1 min, albo aktywnosc trwa >= 3 min. Odswiezenie w tle
  # (pakiet zapytan w jednej sekundzie, OCSP, powiadomienie) zamyka sie po
  # cichu i nie liczy sie nigdzie.
  confirm_minutes: 5
  confirm_moments: 3
  # Jak dlugo ruch wspoldzielony (CDN, SDK reklamowe) moze przedluzac sesje,
  # liczac od ostatniego ROZPOZNANEGO zdarzenia. Za malo: godzinna gra, ktora
  # rzadko gada z wlasnym zapleczem, rozpada sie na kilka sesji. Za duzo:
  # odswiezanie aplikacji w tle po odlozeniu iPada sztucznie wydluza sesje.
  shared_extend_minutes: 30
  daily_summary_time: "20:30"
  max_notifications_per_hour: 12    # na urzadzenie; nadmiar agregowany
  quiet_hours:                      # usun caly blok, zeby wylaczyc
    start: "21:30"
    end: "07:00"
    # W cichych godzinach: zadnych pushy o aplikacjach, tylko start sesji,
    # za to z podwyzszonym priorytetem.
    session_start_priority: 5
  # Alarm nocnego uzywania: "🌙 <dziecko> uzywa iPada w nocy — 23:12, YouTube"
  # (+ "w domu"/"poza domem" ze swiezego odczytu UniFi). Start sesji w nocy to
  # JEDEN push w formie nocnej zamiast dopisku o cichych godzinach; sesja
  # trwajaca w nocy dostaje przypomnienie co reminder_minutes.
  # Bez start/end okno nocy = quiet_hours.
  night:
    enabled: true
    # start: "21:30"
    # end: "06:30"
    reminder_minutes: 30
  # Raport tygodnia (tydzien ISO pon-nd): minuty vs poprzedni tydzien, sesje,
  # dni aktywne, top 5 aplikacji, najdluzsza sesja, uzycie nocne, TV.
  weekly_report:
    enabled: true
    weekday: 6              # 0 = poniedzialek ... 6 = niedziela
    time: "19:00"

# ------------------------------------------------- czas gry (panel -> NextDNS)
# Przyciski "Zablokuj gry / Odblokuj / +30 min" na karcie iPada. Przelacza
# `active` ponizszych uslug i kategorii w kontroli rodzicielskiej NextDNS.
# Blokady sa ustawieniem PROFILU — kazde dziecko potrzebuje wlasnego profilu
# (devices[].nextdns_profile), inaczej blokada jednego dotyczy obu.
# Klucz API ten sam co do logow (NEXTDNS_API_KEY).
game_time:
  enabled: false
  # Id uslug NextDNS: 9gag amazon bereal blizzard chatgpt dailymotion discord
  # disneyplus ebay facebook fortnite google-chat hbomax hulu imgur instagram
  # leagueoflegends mastodon messenger minecraft netflix pinterest
  # playstation-network primevideo reddit roblox signal skype snapchat spotify
  # steam telegram tiktok tinder tumblr twitch twitter vimeo vk whatsapp
  # xboxlive youtube zoom
  services: [youtube, roblox, minecraft, fortnite, tiktok, twitch]
  # Kategorie: dating gambling gaming piracy porn social-networks video-streaming
  # (video-streaming blokuje tez Netflixa i Disney+).
  categories: [gaming]
  default_bonus_minutes: 30
  max_bonus_minutes: 180
  sync_minutes: 5           # co tyle odczyt stanu z NextDNS (zmiany reczne)
  # Codzienna blokada; rano zdejmowana tylko blokada ustawiona przez harmonogram.
  # block_schedule:
  #   start: "20:00"
  #   end: "07:00"

# ------------------------------------------------- czujka wlasnej niesprawnosci
# NAJWAZNIEJSZA sekcja przy iPadach BEZ nadzoru. Dziecko moze zdjac profil DNS
# w Ustawieniach, a wtedy jego iPad po prostu znika z logow — co wyglada dokladnie
# tak samo jak "iPad lezy w szufladzie". Dlatego cisze traktujemy jako awarie,
# nie jako brak aktywnosci.
#
# iPad odpytuje domeny Apple non stop, takze spiac. Wiec cisza LICZAC SZUM znaczy
# jedno: przestalismy widziec to urzadzenie.
watchdog:
  enabled: true

  # Cisza calego strumienia (zadne urzadzenie nic nie zglasza) — awaria po naszej
  # stronie: zerwany token, padnieta siec, zablokowane konto NextDNS.
  stream_silence_minutes: 20

  # Cisza JEDNEGO urzadzenia, gdy inne nadal raportuja — najprawdopodobniej
  # zdjety profil albo wylaczony DNS na tym iPadzie. Dluzszy prog, bo iPad moze
  # byc autentycznie wylaczony na noc.
  device_silence_minutes: 180

  # Nie alarmuj o ciszy urzadzenia w cichych godzinach — wtedy iPad ma prawo spac.
  device_silence_ignore_quiet_hours: true

  # Kolejne przypomnienia o TEJ SAMEJ awarii w rosnacych odstepach, zeby jedna
  # usterka nie zalala telefonu: 20 min, 40, 80, 160... do sufitu ponizej.
  repeat_backoff_max_minutes: 480

# ---------------------------------------------------------------- powiadomienia
notifiers:
  ntfy:
    enabled: true
    # NAZWA TEMATU JEST HASLEM: ntfy.sh nie ma kontroli dostepu, kto zna nazwe,
    # czyta wszystkie powiadomienia o Twoich dzieciach i moze wysylac falszywe.
    # Dlatego NIE wpisuj jej tutaj — ustaw zmienna NTFY_TOPIC.
    # WYMAGA ustawienia NTFY_TOPIC — bez tego konfiguracja NIE zwaliduje sie.
    # Wylosuj dlugi temat:
    #   python3 -c "import secrets;print('kidwatch-'+secrets.token_hex(14))"
    server: "https://ntfy.sh"
    topic: ""
    default_priority: 3
  homeassistant:
    enabled: false
    base_url: "http://192.168.1.20:8123"

# ------------------------------------------- odczyt wprost z iPadow (lockdown)
# Druga, NIEZALEZNA warstwa. Daje to, czego DNS nie da: co jest odpalone i kiedy
# iPad byl odblokowany (nowy PID znanej aplikacji dowodzi odblokowania, bo z
# ekranu blokady nie odpalisz gry).
#
# Wymaga JEDNORAZOWEGO sparowania po kablu:
#   pymobiledevice3 lockdown pair --udid <UDID>
#   pymobiledevice3 lockdown wifi-connections on --udid <UDID>
# Rekordy parowania sa PRZENOSNE miedzy maszynami — sprawdzone na Linuksie.
#
# UWAGA na `host` w sekcji devices: MUSI byc adresem IPv4 w TEJ SAMEJ sieci
# lokalnej co iPad. iOS przyjmuje lockdown tylko z sieci lokalnej — przez VPN
# (Tailscale, WireGuard) konczy sie ConnectionReset, sprawdzone 2026-10-02.
# Odczyt musi wiec chodzic na maszynie w domowym LAN.
#   * po adresie IPv6 lista PROCESOW dziala, ale lista APLIKACJI i STAN EKRANU
#     padaja na ConnectionTerminatedError — sprawdzone A/B na jednym iPadzie.
#     Bonjour zglasza iPady wlasnie po IPv6, wiec latwo sie na tym przejechac.
#     Konfiguracja odrzuca IPv6 jawnym bledem.
#
# iPad ODPADA od Wi-Fi, gdy zasnie, i nic tego nie naprawi. Nieosiagalnosc
# jest tu NORMALNA, nie awaria — dlatego warstwa DNS zostaje jako zrodlo dzialajace
# zawsze. Ale warstwa, ktora nie zadziala ANI RAZU przez unreachable_alert_hours,
# zglasza sie jako awaria, bo inaczej bylaby nieodrozialna od spiacego iPada.
device_read:
  enabled: false
  pair_record_dir: "~/.pymobiledevice3"
  poll_seconds: 60
  timeout_seconds: 20
  # Budzet godzinowy TEJ warstwy, oddzielony od engine.max_notifications_per_hour.
  # Wspolny licznik sprawial, ze godzina przelaczania aplikacji zaglodzila
  # powiadomienia o sesjach DNS.
  max_notifications_per_hour: 30
  unreachable_alert_hours: 24
  # Nazwy procesow bez zwiazku z nazwa aplikacji. Sprawdzone na sprzecie:
  # Disney+ chodzi jako `Dominguez`. "Logika i Matematyka" jako `academy` jest
  # lapana heurystyka, alias niepotrzebny.
  process_aliases:
    Dominguez: com.disney.disneyplus

# ----------------------------------------------------------------- przechowalnia
store:
  # Wzgledem katalogu z tym plikiem. Zmienna KIDWATCH_STORE_PATH nadpisuje
  # te sciezke (docker-compose.yml ustawia /data/kidwatch.db, czyli wolumen).
  path: "kidwatch.db"
  retention_days: 30    # zdarzenia starsze sa kasowane; 0 = nie kasuj nigdy
  rollup_retention_days: 0   # agregaty dzienne (trendy, CSV); 0 = bez limitu
