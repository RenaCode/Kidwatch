name: Testy, obraz i podbicie tagu

# Przy kazdym pushu na main: testy -> obraz do ghcr.io -> podbicie tagu w
# charts/kidwatch/values.yaml. ArgoCD na VPS obserwuje ten plik i sam
# synchronizuje wdrozenie, wiec nie ma tu zadnego SSH ani `kubectl apply`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Na sztywno, malymi literami: `repository_owner` to "RenaCode", a nazwa
  # repozytorium obrazu w rejestrze MUSI byc malymi literami - buildx odrzucal
  # tag i obraz nie powstawal od pierwszego przebiegu. Ta sama nazwa stoi
  # w charts/kidwatch/values.yaml (image.repository).
  IMAGE_NAME: renacode/kidwatch

# Domyslnie tylko odczyt (przeglad 04.10, K-5): job `testy` biegnie tez dla
# PR-ow i uruchamia ich kod. Zapis dostaja tylko joby, ktore go potrzebuja.
# Akcje przypiete po SHA (komentarz = wersja); piny podbija Dependabot.
permissions:
  contents: read

jobs:
  testy:
    name: Testy i lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # --frozen: buduj DOKLADNIE to, co w uv.lock. Bez tego CI moglby przejsc
      # na innych wersjach niz obraz, a rozjazd wyszedlby dopiero na produkcji.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      # Front: testy i build juz w PR, a nie dopiero w `docker build` na main.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # Chart musi sie renderowac, zanim obraz pojdzie na produkcje. Zly szablon
      # wychodzi inaczej dopiero w ArgoCD, jako nieudany sync bez jasnej przyczyny.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/kidwatch
      - run: helm template kidwatch charts/kidwatch > /dev/null

  obraz:
    name: Obraz do ghcr.io
    needs: testy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Klaster to k3s na VPS-ie — jeden ksztalt platformy wystarczy, a
          # budowanie arm64 przez QEMU wydluzalo by przebieg bez potrzeby.
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag:
    name: Podbicie tagu w values.yaml
    needs: obraz
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Jeden podbijacz naraz (K-6). Bez tego tag starszego przebiegu, ktory
    # skonczyl sie pozniej, nadpisywal tag nowszego i Argo cofalo wdrozenie.
    concurrency:
      group: kidwatch-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          # Pelna historia: ponizej porownujemy commity po skroconym SHA z tagu.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Podmien tag obrazu
        run: |
          set -euo pipefail
          SHA="sha-${{ needs.obraz.outputs.sha_short }}"
          # Checkout to BIEZACY main, nie github.sha. Podbijamy tylko wtedy,
          # gdy nasz commit nadal jest na main i nie ma tam juz tagu nowszego
          # commita - inaczej starszy przebieg cofnalby wdrozenie.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "commit $GITHUB_SHA nie jest na main, pomijam"
            exit 0
          fi
          CUR=$(sed -n -E '/^image:/,/^[[:space:]]*pullPolicy:/ s|^[[:space:]]*tag: "sha-([0-9a-f]+)"$|\1|p' \
            charts/kidwatch/values.yaml)
          if [ -n "$CUR" ] && CUR_FULL=$(git rev-parse --verify -q "$CUR^{commit}"); then
            if [ "$CUR_FULL" != "$GITHUB_SHA" ] \
               && git merge-base --is-ancestor "$GITHUB_SHA" "$CUR_FULL"; then
              echo "w values.yaml jest juz tag nowszego commita (sha-$CUR), pomijam"
              exit 0
            fi
          fi
          # Sed ograniczony do bloku `image:` w sekcji glownej, zeby nie ruszyc
          # przypadkiem tagu Tailscale — ten jest pinowany swiadomie i podbicie
          # go razem z obrazem aplikacji zmienialoby zachowanie sieci poda.
          sed -i -E "/^image:/,/^[[:space:]]*pullPolicy:/ { s|^([[:space:]]*)tag: \".*\"$|\1tag: \"$SHA\"| }" \
            charts/kidwatch/values.yaml
          grep -q "tag: \"$SHA\"" charts/kidwatch/values.yaml \
            || { echo "::error::sed nie podmienil tagu obrazu"; exit 1; }
          # Tag Tailscale MUSI zostac nietkniety.
          grep -q 'tag: "v1\.' charts/kidwatch/values.yaml \
            || { echo "::error::sed zniszczyl tag Tailscale"; exit 1; }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/kidwatch/values.yaml
          if git diff --cached --quiet; then
            echo "tag juz aktualny, nic do zrobienia"
            exit 0
          fi
          # [skip ci] jest tu KONIECZNE: bez tego commit z podbiciem tagu
          # uruchamialby ten workflow od nowa, w petli.
          git commit -m "chore: obraz sha-${{ needs.obraz.outputs.sha_short }} [skip ci]"
          # Dwa przebiegi blisko siebie powoduja "rejected (fetch first)".
          # Ponawiamy z rebase, zamiast wywalac caly przebieg.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push odrzucony (proba $attempt) — rebase i ponowienie"
            git pull --rebase --autostash
          done
          echo "::error::nie udalo sie wypchnac podbicia tagu"
          exit 1
