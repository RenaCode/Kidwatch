# Przeglad 04.10 (K-5, K-13): piny akcji po SHA i zaleznosci podbija Dependabot,
# PR-em, raz w tygodniu. Plik dziala po wlaczeniu Dependabota w ustawieniach repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Jeden PR na tydzien zamiast osobnych: react/react-dom i vite/plugin-react
    # musza isc razem, inaczej kazdy PR z osobna pada w CI na konflikcie wersji.
    groups:
      web:
        patterns: ["*"]
    # Skoki glownych wersji (react 19, vite 8) wymagaja zmian w kodzie - recznie.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
